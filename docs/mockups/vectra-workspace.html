y — controls do not edit artwork.</div><h3>Layers</h3><div class="layer">◉ Vector artwork</div><div class="layer">◉ Original image · locked</div><div class="layer">◉ Background</div></aside></main><footer><span>RGB · Vector document</span><span class="spacer"></span><span>Interactive concept · not an editor</span></footer><script>
const tools=[["select","Select","M5 3l14 9-7 2-3 7z",["Opacity","Scale","Rotation"]],["trace","Image Trace","M4 9V4h5 M15 4h5v5 M20 15v5h-5 M9 20H4v-5 M4 12h16",["Detail","Color precision","Threshold"]],["nodes","Node Editor","M3 21l7-7 M10 14l2-9 7-2 2 7-9 2z M14 10h.01",["Handle length","Corner sharpness"]],["smooth","Smooth","M3 18C8 18 5 5 12 5s4 13 9 13 M3 18h.01 M12 5h.01 M21 18h.01",["Strength","Corner preservation","Iterations"]],["simplify","Simplify","M4 4l6 6 M4 10h6V4 M20 20l-6-6 M20 14h-6v6",["Tolerance","Detail preservation"]],["color","Recolor","M12 3a9 9 0 1 0 0 18h1a2 2 0 0 0 1-4 2 2 0 0 1 1-4h3a3 3 0 0 0 3-3c0-4-4-7-9-7z M7 10h.01 M10 6h.01 M15 6h.01",["Saturation","Contrast","Brightness"]],["offset","Offset","M3 7l9-4 9 4-9 4z M3 12l9 4 9-4 M3 17l9 4 9-4",["Distance","Roundness"]],["distress","Distress","M2 12h4l3-8 4 16 3-8h6",["Intensity","Frequency","Irregularity"]],["halftone","Halftone","M4 4h4v4H4z M10 4h4v4h-4z M16 4h4v4h-4z M4 10h4v4H4z M10 10h4v4h-4z M16 10h4v4h-4z M4 16h4v4H4z M10 16h4v4h-4z M16 16h4v4h-4z",["Density","Dot size","Angle"]],["engrave","Engrave","M3 21l4-1L21 6l-3-3L4 17z M14 7l3 3 M4 4l16 16",["Spacing","Line width","Angle"]],["boolean","Shape Builder","M3 3h12v12H3z M9 9h12v12H9z",[]],["cleanup","Cleanup","M3 15l10-11 8 8-8 9H9z M8 10l8 8",["Minimum area","Strength"]],["style","Style","M12 2l2 6 6 2-6 2-2 6-2-6-6-2 6-2z M20 15l1 3 3 1-3 1-1 3-1-3-3-1 3-1z",["Contrast","Distress","Copy generations"]]];const descriptions={select:'Select and transform vector objects',trace:'Convert raster artwork into editable paths',nodes:'Edit anchors and Bézier handles',smooth:'Refine uneven curves',simplify:'Reduce unnecessary anchor points',color:'Customize ink palettes',offset:'Expand or contract vector outlines',distress:'Create irregular ink edges',halftone:'Generate vector dot patterns',engrave:'Create engraved line shading',boolean:'Combine and subtract vector shapes',cleanup:'Remove unwanted shapes and speckles',style:'Explore creative print presets'};
const nav=document.querySelector('#tools'),panel=document.querySelector('#inspector'),notice=document.querySelector('#notice');let active='smooth',zoom=100;const settings={smooth:{Strength:35,'Corner preservation':80,Iterations:2}};
function el(tag,text){const e=document.createElement(tag);if(text)e.textContent=text;return e}
function button(text,fn){const b=el('button',text);b.onclick=fn;return b}
function note(text){notice.textContent=text+' — illustration unchanged in this prototype.'}
function render(){nav.replaceChildren();for(const [id,name,path] of tools){const b=button('',()=>{active=id;render()});b.title=name;b.setAttribute('aria-label',name);b.setAttribute('aria-pressed',String(id===active));b.classList.toggle('active',id===active);b.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="'+path+'"/></svg>';nav.append(b)}
const [,name,,controls]=tools.find(t=>t[0]===active);document.querySelector('#toolname').textContent=name;document.querySelector('#description').textContent=descriptions[active];panel.replaceChildren();
const scope=el('label','Scope');panel.append(scope);const sel=el('select');sel.setAttribute('aria-label','Effect scope');['Selected artwork','Active layer','Entire artwork'].forEach(s=>sel.append(el('option',s)));panel.append(sel);
if(active==='trace'||active==='style'){panel.append(el('label','Preset'));const select=el('select');select.setAttribute('aria-label','Preset');const families={'Core':['Black & White','Grayscale','Full Color','Limited Color','Line Art','Silhouette'],'Print':['Old Print','Halftone','Screen Print','Poster','Comic Ink'],'DIY Underground':['Xerox','Newsprint','Hardcore','Cut & Paste','Copy of a Copy','Bootleg']};for(const [group,items] of Object.entries(families)){const g=el('optgroup');g.label=group;items.forEach(v=>g.append(el('option',v)));select.append(g)}select.value=active==='style'?'Copy of a Copy':'Old Print';select.onchange=()=>note('Selected '+select.value);panel.append(select)}
for(const c of controls){const lab=el('label',c),value=el('span'),input=el('input');input.type='range';input.min=c==='Iterations'||c==='Copy generations'?1:0;input.max=c==='Iterations'?10:c==='Copy generations'?20:100;input.value=settings[active]?.[c]??(c==='Copy generations'?5:50);input.id='control-'+c.replaceAll(' ','-');lab.htmlFor=input.id;value.textContent=input.value;lab.append(value);input.oninput=()=>{(settings[active]??={})[c]=Number(input.value);value.textContent=input.value};panel.append(lab,input)}
if(active==='color'){const row=el('div');row.className='swatches';for(const c of ['#22221e','#e8dec2','#8d4a36','#859267']){const s=el('span');s.style.background=c;row.append(s)}panel.append(row)}
if(active==='boolean'){for(const op of ['Union','Subtract','Intersect','Exclude'])panel.append(button(op,()=>note(op+' selected')))}
const row=el('div');row.className='actions';const apply=button('Apply effect',()=>note(name+' applied conceptually'));apply.className='accent';row.append(apply,button('Reset',()=>{delete settings[active];render();note('Reset')}),button('Cancel',()=>note('Cancelled')));panel.append(row)}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));document.querySelector('#paper').className='paper '+b.dataset.mode;if(b.dataset.mode==='compare')note('Compare placeholder')});function changeZoom(delta){zoom=Math.max(25,Math.min(200,zoom+delta));document.querySelector('#zoom').textContent=zoom+'%';document.querySelector('#paper').style.transform='scale('+zoom/100+')'}document.querySelector('#minus').onclick=()=>changeZoom(-25);document.querySelector('#plus').onclick=()=>changeZoom(25);document.querySelector('#export').onclick=()=>note('Export would open SVG / PDF options');render();
