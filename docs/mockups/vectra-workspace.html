function demoThumb(p){return '<svg viewBox="0 0 160 120" aria-hidden="true"><rect width="160" height="120" fill="'+p.bg+'"/>'+p.art+'</svg>'}
function updateImportState(){useImage.disabled=source==='unsplash'?!selectedPhoto:source==='local'?!selectedFile:true;importHint.textContent=source==='unsplash'?'Mock data only · No network requests':source==='local'?(selectedFile?selectedFile.name:'Choose a file'):'Clipboard access is not implemented in this concept.'}
function renderImport(){document.querySelectorAll('[data-source]').forEach(b=>{b.classList.toggle('active',b.dataset.source===source);b.setAttribute('aria-pressed',String(b.dataset.source===source))});importBody.replaceChildren();
if(source==='local'){const wrap=el('div');wrap.className='empty-import';wrap.append(el('h3','Choose a local image'),el('p','PNG, JPEG or WebP · Processed on your device'));const file=el('input');file.type='file';file.accept='image/png,image/jpeg,image/webp';file.setAttribute('aria-label','Choose local image');file.onchange=()=>{selectedFile=file.files[0]||null;updateImportState()};wrap.append(file);importBody.append(wrap)}
else if(source==='clipboard'){const wrap=el('div');wrap.className='empty-import';wrap.append(el('h3','Paste an image'),el('p','Production design: paste with Ctrl/Cmd+V or explicitly read clipboard.'));importBody.append(wrap)}
else {const disclosure=el('p','Photo search is optional and online in production. Search terms and image requests go to the provider; editing remains local. These are original illustrative placeholders, not actual Unsplash photos or credits.');disclosure.className='import-disclosure';const form=el('form');form.className='search-row';const q=el('input');q.type='search';q.value=query;q.placeholder='Search photos';q.setAttribute('aria-label','Search photos');const sb=el('button','Search');sb.type='submit';form.append(q,sb);form.onsubmit=e=>{e.preventDefault();query=q.value;selectedPhoto=null;renderImport()};const layout=el('div');layout.className='search-layout';const grid=el('div');grid.className='photo-grid';const matches=demoPhotos.filter(p=>!query.trim()||query.toLowerCase().trim().split(/\s+/).every(w=>(p.title+' '+p.tags).toLowerCase().includes(w)));const preview=el('div');preview.className='photo-preview';
function drawSelection(){grid.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.id===selectedPhoto?.id)));preview.replaceChildren();if(!selectedPhoto){preview.append(el('h3','Select a photo'),el('p','Preview, photographer credit and import size appear here.'))}else{const thumb=el('div');thumb.innerHTML=demoThumb(selectedPhoto);preview.append(thumb,el('h3',selectedPhoto.title),el('p','Photographer: credit placeholder · Unsplash (concept)'),el('p','Original size: '+selectedPhoto.size));const link=el('a','Provider and license information');link.href='https://unsplash.com/license';link.target='_blank';link.rel='noopener noreferrer';preview.append(link);const label=el('label','Import resolution');label.htmlFor='import-size';const size=el('select');size.id='import-size';['Preview · 1 MP','Standard · 4 MP','Original · subject to limits'].forEach(v=>size.append(el('option',v)));size.selectedIndex=1;preview.append(label,size,el('p','Required download event would be recorded only when Use image is clicked.'))}updateImportState()}
for(const p of matches){const b=button('',()=>{selectedPhoto=p;drawSelection()});b.className='photo-card';b.dataset.id=p.id;b.setAttribute('aria-label','Select '+p.title);b.innerHTML=demoThumb(p);b.append(el('strong',p.title),el('small','Demo credit'));grid.append(b)}if(!matches.length){const empty=el('p','No sample results. Try music, flower, portrait or city.');empty.className='import-state';grid.append(empty)}layout.append(grid,preview);importBody.append(disclosure,form,layout);drawSelection()}
updateImportState()}
document.querySelectorAll('[data-source]').forEach(b=>b.onclick=()=>{source=b.dataset.source;selectedPhoto=null;selectedFile=null;renderImport()});document.querySelector('#open-import').onclick=()=>{source='local';selectedPhoto=null;selectedFile=null;renderImport();importDialog.showModal()};document.querySelector('#close-import').onclick=()=>importDialog.close();document.querySelector('#cancel-import').onclick=()=>importDialog.close();useImage.onclick=()=>{const name=source==='unsplash'?selectedPhoto?.title:selectedFile?.name;if(!name)return;importDialog.close();active='trace';render();note('Import selected: '+name+'; production would decode locally and open Image Trace')};
