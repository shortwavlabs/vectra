catalog:
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vite-plus: 1.7.0
overrides:
  vite@*: "catalog:"
# core-js is an optional dependency of the evaluation-only jsPDF; its postinstall script
