[package]
name = "vector-engine-wasm"
description = "wasm-bindgen adapter exposing vector-engine to the browser worker."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
vector-engine = { path = "../../crates/vector-engine" }
# Must exactly match the wasm-bindgen CLI version (checked by scripts/build-wasm.mjs).
wasm-bindgen = "=0.2.130"
serde_json = "1.0.154"
